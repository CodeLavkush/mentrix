components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiResponse:
      type: object
      properties:
        statusCode:
          type: integer
          example: 200
        data:
          type: object
        message:
          type: string
          example: Request successful

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          format: password
          example: Password@123

    VerifyEmailRequest:
      type: object
      required:
        - email
        - otp
      properties:
        email:
          type: string
          format: email
          example: john@example.com
        otp:
          type: string
          minLength: 6
          maxLength: 6
          example: "123456"

    AcademicProfileRequest:
      type: object
      properties:
        collegeName:
          type: string
          example: ABC College
        universityName:
          type: string
          example: Mumbai University
        course:
          type: string
          example: BSc IT
        branch:
          type: string
          example: Information Technology
        year:
          type: integer
          example: 3
        semester:
          type: integer
          example: 6
        rollNumber:
          type: integer
          example: 123456

    SendMessageRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: What is the main theme of chapter 2?

    CreateQuizRequest:
      type: object
      required:
        - quizTitle
        - difficulty
        - totalQuestions
      properties:
        quizTitle:
          type: string
          example: JavaScript Async Quiz
        difficulty:
          type: string
          enum: [EASY, MEDIUM, HARD]
          example: MEDIUM
        totalQuestions:
          type: integer
          example: 10

    CreateQuizAttemptRequest:
      type: object
      required:
        - score
        - totalMarks
        - percentage
        - timeTaken
      properties:
        score:
          type: integer
          example: 80
        totalMarks:
          type: integer
          example: 100
        percentage:
          type: number
          format: float
          example: 80.0
        timeTaken:
          type: integer
          description: Time taken in seconds
          example: 120

    CreateFlashcardSetRequest:
      type: object
      required:
        - title
        - topic
        - totalCards
      properties:
        title:
          type: string
          example: Core Concepts
        topic:
          type: string
          example: Asynchronous Operations
        totalCards:
          type: integer
          example: 10

    CreateFlashcardProgressRequest:
      type: object
      required:
        - reviewCount
        - correctCount
        - masteryLevel
      properties:
        reviewCount:
          type: integer
          example: 5
        correctCount:
          type: integer
          example: 4
        masteryLevel:
          type: number
          format: float
          example: 0.8

    CreateNoteRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          example: Key Concepts Summary