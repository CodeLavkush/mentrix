openapi: 3.0.3

info:
  title: Mentrix API
  description: Complete REST API documentation for the Mentrix platform (AI Study Companion, Document Management, Quizzes, Flashcards, Notes, and Whiteboard).
  version: 1.0.0

servers:
  - url: http://localhost:4000/api/v1
    description: Local development server

tags:
  - name: Healthcheck
    description: Server status and health diagnostics
  - name: Authentication
    description: User authentication, registration, OTP verification, and session management
  - name: Profile
    description: User academic profile management
  - name: Document
    description: PDF and study document upload, listing, downloading, and deletion
  - name: Chat
    description: AI-assisted document conversation and history
  - name: Quiz
    description: AI-generated quiz creation, retrieval, and management
  - name: Quiz Questions
    description: Fetching generated questions for a quiz
  - name: Quiz Attempts
    description: Recording quiz attempts, scoring, and viewing attempt history
  - name: Flashcard Sets
    description: Creating and managing sets of study flashcards derived from quiz attempts
  - name: Flashcards
    description: Retrieving individual flashcards within a flashcard set
  - name: Flashcard Progress
    description: Tracking review counts, mastery level, and progress for individual flashcards
  - name: Notes
    description: Creating, listing, and managing study notes attached to documents
  - name: Whiteboard
    description: Interactive whiteboard creation, thumbnail uploading, and drawing data management

paths:
  # =====================================================
  # HEALTHCHECK
  # =====================================================
  /healthcheck:
    get:
      tags:
        - Healthcheck
      summary: Health check endpoint
      description: Verifies that the API server is up and running.
      responses:
        "200":
          description: Server is active and operational
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                data:
                  message: Server is running
                message: Request successful

  # =====================================================
  # AUTHENTICATION
  # =====================================================
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Creates a user account, optionally uploads an avatar, and sends an email verification OTP.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - username
                - gender
                - age
                - email
                - password
              properties:
                username:
                  type: string
                  example: john_doe
                gender:
                  type: string
                  example: male
                age:
                  type: integer
                  example: 22
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  format: password
                  example: Password@123
                avatar:
                  type: string
                  format: binary
                  description: Optional profile picture (image file)
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 201
                data:
                  id: user-id-123
                  username: john_doe
                  gender: male
                  age: 22
                  email: john@example.com
                  isEmailVerified: false
                  avatarUrl: http://localhost:9000/avatars/avatar.png
                message: User registered successfully. Please check your email for the OTP to verify your account.
        "409":
          description: User with email or username already exists
        "422":
          description: Validation error

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate user
      description: Logs in a user with email and password, setting access and refresh token cookies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: User logged in successfully
          headers:
            Set-Cookie:
              schema:
                type: string
                example: accessToken=jwt-token; Path=/; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                data:
                  user:
                    id: user-id-123
                    username: john_doe
                    email: john@example.com
                    gender: male
                    age: 22
                    isEmailVerified: true
                  accessToken: eyJhbGciOiJIUzI1NiIs...
                  refreshToken: eyJhbGciOiJIUzI1NiIs...
                message: User logged in successfully
        "401":
          description: Invalid email or password / Email not verified
        "422":
          description: Email and password are required

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: Clears HTTP-only token cookies and invalidates the session.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                data: {}
                message: User logged out
        "401":
          description: Unauthorized

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get authenticated user details
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                data:
                  id: user-id-123
                  username: john_doe
                  email: john@example.com
                  gender: male
                  age: 22
                  avatarUrl: http://localhost:9000/avatars/avatar.png
                  isEmailVerified: true
                message: Current user fetched successfully
        "401":
          description: Unauthorized

  /auth/verify-email:
    post:
      tags:
        - Authentication
      summary: Verify email address via OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                data:
                  id: user-id-123
                  username: john_doe
                  isEmailVerified: true
                message: Email is Verified
        "400":
          description: Invalid or expired OTP
        "404":
          description: User does not exist

  /auth/resend-verification:
    post:
      tags:
        - Authentication
      summary: Resend OTP email verification
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Verification OTP email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                data: {}
                message: Mail has been sent to john@example.com
        "401":
          description: Unauthorized
        "404":
          description: User does not exist or email already verified

  /auth/refresh-token:
    post:
      tags:
        - Authentication
      summary: Refresh JWT access token
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIs...
      responses:
        "200":
          description: Access token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIs...
                  refreshToken: eyJhbGciOiJIUzI1NiIs...
                message: Access Token refreshed
        "401":
          description: Invalid or missing refresh token

  # =====================================================
  # PROFILE
  # =====================================================
  /profile/academics:
    post:
      tags:
        - Profile
      summary: Create academic profile details
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicProfileRequest"
      responses:
        "201":
          description: Academic profile created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 201
                data:
                  id: profile-id-123
                  collegeName: ABC College
                  universityName: Mumbai University
                  course: BSc IT
                  branch: Information Technology
                  year: 3
                  semester: 6
                  rollNumber: 123456
                message: Academic details added successfully
        "401":
          description: Unauthorized
        "409":
          description: Academic details already exist for user

    get:
      tags:
        - Profile
      summary: Get academic profile details
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Academic details fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                data:
                  id: profile-id-123
                  collegeName: ABC College
                  universityName: Mumbai University
                  course: BSc IT
                  branch: Information Technology
                  year: 3
                  semester: 6
                  rollNumber: 123456
                message: Profile fetched successfully
        "401":
          description: Unauthorized
        "404":
          description: Academic details not found

    patch:
      tags:
        - Profile
      summary: Update academic profile details
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicProfileRequest"
      responses:
        "200":
          description: Academic profile updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                data:
                  id: profile-id-123
                message: Academic details successfully updated.
        "401":
          description: Unauthorized
        "404":
          description: User or academic details not found

  # =====================================================
  # DOCUMENT
  # =====================================================
  /document:
    post:
      tags:
        - Document
      summary: Upload a study document (PDF/TXT)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - document
              properties:
                document:
                  type: string
                  format: binary
                  description: File to upload (PDF, TXT, etc.)
      responses:
        "201":
          description: Document uploaded and queued for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 201
                data:
                  id: doc-id-123
                  fileName: javascript_guide.pdf
                  fileType: application/pdf
                  fileSize: 1048576
                  uploadStatus: PROCESSING
                message: File Uploaded and queued for processing
        "400":
          description: File missing or file upload failed
        "401":
          description: Unauthorized

    get:
      tags:
        - Document
      summary: Get all documents uploaded by user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Documents fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                data:
                  - id: doc-id-123
                    fileName: javascript_guide.pdf
                    fileType: application/pdf
                    fileSize: 1048576
                    uploadStatus: READY
                message: Documents fetched Successfully
        "401":
          description: Unauthorized
        "404":
          description: No documents found for the user

  /document/{documentId}:
    delete:
      tags:
        - Document
      summary: Delete a document by ID
      security:
        - bearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          example: doc-id-123
      responses:
        "200":
          description: Document deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                data:
                  id: doc-id-123
                  fileName: javascript_guide.pdf
                message: Document deleted successfully
        "401":
          description: Unauthorized
        "404":
          description: Document not found

  /document/{documentId}/download:
    get:
      tags:
        - Document
      summary: Download document file
      description: Generates a presigned URL to download the original document from storage.
      security:
        - bearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          example: doc-id-123
      responses:
        "200":
          description: Download URL generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                data:
                  downloadUrl: http://localhost:9000/documents/doc-id-123.pdf
                  fileName: javascript_guide.pdf
                message: Document downloaded link generated successfully
        "401":
          description: Unauthorized
        "404":
          description: Document not found

  # =====================================================
  # CHAT
  # =====================================================
  /chat/{documentId}:
    post:
      tags:
        - Chat
      summary: Send a question to AI regarding document
      description: Sends user question, retrieves response from AI Service, and records conversation.
      security:
        - bearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          example: doc-id-123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: AI response generated and sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 201
                data:
                  id: msg-id-456
                  message: JavaScript is a dynamic programming language...
                message: AI Message sent.
        "401":
          description: Unauthorized
        "404":
          description: Document not found or AI service error

    get:
      tags:
        - Chat
      summary: Get chat message history for document
      security:
        - bearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          example: doc-id-123
      responses:
        "200":
          description: Chat history fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                data:
                  document:
                    id: doc-id-123
                    fileName: javascript_guide.pdf
                  messages:
                    - id: msg-id-123
                      message: What is JavaScript?
                      sender: USER
                      timestamp: 2026-08-15T10:00:00.000Z
                    - id: msg-id-456
                      message: JavaScript is a programming language...
                      sender: AI
                      timestamp: 2026-08-15T10:00:02.000Z
                message: Messages fetched successfully
        "401":
          description: Unauthorized
        "404":
          description: Document or messages not found

  # =====================================================
  # QUIZ
  # =====================================================
  /quiz/{documentId}:
    post:
      tags:
        - Quiz
      summary: Generate a new quiz from document content
      security:
        - bearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          example: doc-id-123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuizRequest"
      responses:
        "201":
          description: Quiz generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 201
                data:
                  id: quiz-id-123
                  userId: user-id-123
                  documentId: doc-id-123
                  quizTitle: JS Async Quiz
                  difficulty: MEDIUM
                  totalQuestions: 5
                message: Quiz created successfully.
        "401":
          description: Unauthorized
        "404":
          description: User or document not found
        "409":
          description: Quiz creation failed

    get:
      tags:
        - Quiz
      summary: Get all quizzes created for a document
      security:
        - bearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          example: doc-id-123
      responses:
        "200":
          description: Quizzes retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                data:
                  - id: quiz-id-123
                    userId: user-id-123
                    documentId: doc-id-123
                    quizTitle: JS Async Quiz
                    difficulty: MEDIUM
                    totalQuestions: 5
                message: Quzzes fetched successfully.
        "401":
          description: Unauthorized
        "404":
          description: Document or quizzes not found

    delete:
      tags:
        - Quiz
      summary: Delete all quizzes for a document
      security:
        - bearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          example: doc-id-123
      responses:
        "200":
          description: All quizzes deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                data:
                  count: 3
                message: Quiz deleted successfully.
        "401":
          description: Unauthorized
        "404":
          description: Quizzes failed to delete or document not found

  /quiz/{documentId}/{quizId}:
    get:
      tags:
        - Quiz
      summary: Get specific quiz details by ID
      security:
        - bearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          example: doc-id-123
        - name: quizId
          in: path
          required: true
          schema:
            type: string
          example: quiz-id-123
      responses:
        "200":
          description: Quiz details retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                data:
                  id: quiz-id-123
                  quizTitle: JS Async Quiz
                  difficulty: MEDIUM
                  totalQuestions: 5
                  createdAt: 2026-08-15T10:00:00.000Z
                message: Quiz fetched successfully
        "401":
          description: Unauthorized
        "404":
          description: Quiz not found

    delete:
      tags:
        - Quiz
      summary: Delete a specific quiz by ID
      security:
        - bearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          example: doc-id-123
        - name: quizId
          in: path
          required: true
          schema:
            type: string
          example: quiz-id-123
      responses:
        "200":
          description: Quiz deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                data:
                  id: quiz-id-123
                  quizTitle: JS Async Quiz
                message: Quiz deleted successfully.
        "401":
          description: Unauthorized
        "404":
          description: Quiz not found

  # =====================================================
  # QUIZ QUESTIONS
  # =====================================================
  /quiz-questions/{quizId}:
    get:
      tags:
        - Quiz Questions
      summary: Get all questions belonging to a quiz
      security:
        - bearerAuth: []
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: string
          example: quiz-id-123
      responses:
        "200":
          description: Quiz questions fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                data:
                  - id: q-id-1
                    question: What does promise.all return?
                    option_a: Array of results
                    option_b: Single value
                    option_c: Boolean
                    option_d: Void
                    correct_option: A
                    explanation: Promise.all returns an array of resolved values.
                message: Quiz questions fetched successfully
        "401":
          description: Unauthorized
        "404":
          description: Quiz or questions not found

  # =====================================================
  # QUIZ ATTEMPTS
  # =====================================================
  /quiz-attempts/{quizId}:
    post:
      tags:
        - Quiz Attempts
      summary: Record a completed quiz attempt
      security:
        - bearerAuth: []
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: string
          example: quiz-id-123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuizAttemptRequest"
      responses:
        "201":
          description: Quiz attempt saved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 201
                data:
                  id: attempt-id-123
                  score: 80
                  totalMarks: 100
                  percentage: 80.0
                  timeTaken: 120
                message: Quiz attempt recorded successfully
        "401":
          description: Unauthorized
        "404":
          description: Quiz not found

    get:
      tags:
        - Quiz Attempts
      summary: Get all past attempt history for a quiz
      security:
        - bearerAuth: []
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: string
          example: quiz-id-123
      responses:
        "200":
          description: Quiz attempts history retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                data:
                  - id: attempt-id-123
                    score: 80
                    totalMarks: 100
                    percentage: 80.0
                    timeTaken: 120
                    createdAt: 2026-08-15T10:00:00.000Z
                message: Quiz attempts fetched successfully
        "401":
          description: Unauthorized
        "404":
          description: Quiz or attempts not found

  # =====================================================
  # FLASHCARD SETS
  # =====================================================
  /flashcardsets/{quizAttemptId}:
    post:
      tags:
        - Flashcard Sets
      summary: Generate flashcard set from quiz attempt
      security:
        - bearerAuth: []
      parameters:
        - name: quizAttemptId
          in: path
          required: true
          schema:
            type: string
          example: attempt-id-123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFlashcardSetRequest"
      responses:
        "201":
          description: Flashcard set generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 201
                data:
                  id: fc-set-id-123
                  title: JS Promises
                  topic: Asynchronous JS
                  totalCards: 10
                message: Flashcard set created successfully.
        "401":
          description: Unauthorized
        "404":
          description: Quiz attempt not found

    get:
      tags:
        - Flashcard Sets
      summary: Get flashcard sets for quiz attempt
      security:
        - bearerAuth: []
      parameters:
        - name: quizAttemptId
          in: path
          required: true
          schema:
            type: string
          example: attempt-id-123
      responses:
        "200":
          description: Flashcard sets retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                data:
                  - id: fc-set-id-123
                    title: JS Promises
                    topic: Asynchronous JS
                    totalCards: 10
                message: Flashcard sets fetched successfully.
        "401":
          description: Unauthorized
        "404":
          description: Flashcard sets not found

    delete:
      tags:
        - Flashcard Sets
      summary: Delete all flashcard sets for a quiz attempt
      security:
        - bearerAuth: []
      parameters:
        - name: quizAttemptId
          in: path
          required: true
          schema:
            type: string
          example: attempt-id-123
      responses:
        "200":
          description: Flashcard sets deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                data:
                  count: 2
                message: Flashcard sets deleted successfully.
        "401":
          description: Unauthorized
        "404":
          description: Flashcard sets not found

  /flashcardsets/{quizAttemptId}/{flashcardSetsId}:
    get:
      tags:
        - Flashcard Sets
      summary: Get flashcard set by ID
      security:
        - bearerAuth: []
      parameters:
        - name: quizAttemptId
          in: path
          required: true
          schema:
            type: string
          example: attempt-id-123
        - name: flashcardSetsId
          in: path
          required: true
          schema:
            type: string
          example: fc-set-id-123
      responses:
        "200":
          description: Flashcard set fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                data:
                  id: fc-set-id-123
                  title: JS Promises
                  topic: Asynchronous JS
                  totalCards: 10
                message: Flashcard set fetched successfully
        "401":
          description: Unauthorized
        "404":
          description: Flashcard set not found

    delete:
      tags:
        - Flashcard Sets
      summary: Delete a specific flashcard set by ID
      security:
        - bearerAuth: []
      parameters:
        - name: quizAttemptId
